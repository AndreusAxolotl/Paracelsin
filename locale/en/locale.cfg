[mod-name]
Paracelsin=○🌐Paracelsin

[mod-description]
Paracelsin=○🌐Visit the frozen mountains of planet Paracelsin, where mining zinc is a race against clogging and freezing.

[mod-setting-name]
paracelsin-zinc-implementation=Make Aquilo's late techs require Paracelsin resources.
paracelsin-galvanized-promethium=Add Galvanization Science Pack to Promethium research.
paracelsin-elevated-pipes=Make elevated pipes a Paracelsin reward.

[mod-setting-description]
paracelsin-zinc-implementation=Adds the Galvanization science pack to some Aquilo techs and adds zinc solder to Quantum Processors and Electric Coils to Railguns, Railgun Turrets, Fusion Reactors, Fusion Generators and Portable Fusion Reactors. The mod is intended to be played with this setting enabled.

[space-location-name]
paracelsin=Paracelsin

[space-location-description]
paracelsin=A highly cryovolcanically active frozen wasteland. Lakes of [fluid=nitrogen] cover the surface, flowing from an underground ocean. [entity=cryovolcanic-vent]s dot the surface alongside veins of [item=tetrahedrite] and [item=sphalerite], essential for the extraction of [item=zinc]. [item=vaterite] is also present in small veins. Anything built on the planet must be constantly kept warm or it will freeze and all unwanted byproducts of zinc extraction must be disposed of.

