fulgoran-log=Fulgorischer Logbucheintrag

[tips-and-tricks-item-description]
fulgoran-log=Innerhalb des [entity=crashed-fulgoran-pod], neben den Blaupausen, hast du eine Nachricht gefunden. Du konntest es dank der Forschung auf Fulgora übersetzen: "Grüße an alle Lebensformen, die dies finden könnte. Wir sind die Fulgoraner und wir haben diese Poden an dieses gefrorene Ödland geschickt, um nach Öl zu suchen. Unser Streben nach Wachstum führte zu geringfügigen Folgen für die Umwelt unseres Planeten, nicht dass wir uns stören würde, aber auch die meisten unserer geliebten Ölvorräte erschöpft und sammelte sich ein wenig von einer Sicherung der Nebenprodukte seiner Verarbeitung. Wenn Sie einen Ort mit Öl kennen, wenden Sie sich bitte an unseren nächstgelegenen Planetenposten. Wenn Ihr Planet derzeit nicht in der Lage ist, Platz zu fahren, senden Sie bitte diese Nachricht an jemanden, der dies tut. Und wenn wir tot sind... Nun, ich bezweifle, dass wir scheitern können." Du und die Fulgoraner wären große Freunde.

