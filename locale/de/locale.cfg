[mod-setting-description]
paracelsin-zinc-implementation=Fügt einigen Aquilo-Techs das Wissenschaftspaket für Galvanisierung hinzu und fügt Quantenprozessoren und Elektrospulen Zinklötmittel zu Railgun hinzu Fusionsreeaktoren, Fusionsgeneratoren und tragbare Fusionsreactors. Die Mod ist für die Wiedergabe gedacht, wenn diese Einstellung aktiviert ist.

