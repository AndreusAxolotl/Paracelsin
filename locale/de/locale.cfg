elevated-pipe=Starke Stützstruktur, mit der Rohre hoch über dem Boden platziert werden können.
vaterite-formation=Durch die Replikation der Ahneneigenschaften von [planet=paracelsin] in einer [Entity=electrochemical-plant] Pflanze können wir [item=stone] mit [fluid=nitrogen] als Katalysator behandeln, um mehr erzeugen zu können.

